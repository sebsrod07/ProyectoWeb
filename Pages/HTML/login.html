<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESCOMotos - Iniciar Sesión</title>
  <link rel="stylesheet" href="../CSS/auth.css" />
</head>
<body>
  <div class="auth-container">
    <h1>ESCOMotos</h1>
    <h2>Iniciar Sesión</h2>

    <form id="loginForm" autocomplete="on">
      <p>
        <label for="email">Correo</label><br />
        <input type="email" id="email" name="email" placeholder="ejemplo@ipn.mx" required />
      </p>
      <p>
        <label for="password">Contraseña</label><br />
        <input type="password" id="password" name="password" placeholder="Tu contraseña" required />
      </p>
      <p>
        <button type="submit" class="btn-cyber">
          Entrar
          <span class="btn-cyber-border"></span>
        </button>
      </p>
      <p>
        <button id="createAccount" type="button" class="btn-cyber" onclick="redirectCreateAccount()">
          Crear una Cuenta
          <span class="btn-cyber-border"></span>
        </button>
      </p>
    </form>

    <p id="mensaje" role="status"></p>
  </div>

  <script src="../JS/login.js"></script>
</body>
</html>
