<!DOCTYPE html>
<html lang="es">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mis Vehículos - ESCOMotos</title>
        <link rel="stylesheet" href="../CSS/home.css"> 
    </head>
    <body>
        <div class="layout-principal">
            <div class="contenido-principal">
                <h1>Mis Vehículos Registrados</h1>

                <div id="contenedorVehiculos" class="vehiculos-grid"></div>

            <aside class="sidebar-derecho">

                <button type="button" class="btn-cyber btn-sidebar" id="btnRegistrar" onclick="redirectRegistrarV()">

                    <span class="btn-cyber-border"></span>
                </button>
                <button type="button" class="btn-cyber btn-sidebar" id="btnCerrarSesion">
                    Cerrar Sesión
                    <span class="btn-cyber-border"></span>
                </button>
            </aside>
        </div>

        <script src="../JS/Home.js"></script>
