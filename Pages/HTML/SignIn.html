<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - ESCOMotos</title>
    <link rel="stylesheet" href="../CSS/auth.css" />
</head>
<body>
    <div class="auth-container">
        <h1>ESCOMotos</h1>
        <h2>Crear una Cuenta</h2>
        
        <form id="Registro" autocomplete="off">
            <p>
                <label for="nombres">Nombres:</label>
                <input type="text" id="nombres" name="nombres" 
                       pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ]+(?: [a-zA-ZáéíóúÁÉÍÓÚñÑ]+)*$" 
                       title="Debe iniciar y terminar con una letra, usando solo un espacio entre nombres." 
                       required />
            </p>
            <p>
                <label for="APaterno">Apellido Paterno:</label>
                <input type="text" id="APaterno" name="APaterno" required />
            </p>
            <p>
                <label for="AMaterno">Apellido Materno:</label>
                <input type="text" id="AMaterno" name="AMaterno" required />
            </p>
            <p>
                <label for="CURP">CURP:</label>
                <input type="text" id="CURP" name="CURP" required />
            </p>
            <p>
                <label for="RFC">RFC:</label>
                <input type="text" id="RFC" name="RFC" placeholder="Opcional"/>
            </p>
            <p>
                <label for="email">Correo:</label>
                <input type="email" placeholder="ejemplo@alumno.ipn.mx" id="email" name="email" required />
            </p>
            <p>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required />
            </p>
            <p>
                <button type="submit" class="btn-cyber">
                    Registrarse
                    <span class="btn-cyber-border"></span>
                </button>
            </p>
            <p>
                <button type="button" id="redLogin" class="btn-cyber" onclick="window.location.href='login.html'">
                    Iniciar Sesión
                    <span class="btn-cyber-border"></span>
                </button>
            </p>
            <p id="mensaje"></p>
        </form>
    </div>
        
    <script src="../JS/SignIn.js"></script>
</body>
</html>
