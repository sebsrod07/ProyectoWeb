<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguridad - Validar Acceso - ESCOMotos</title>
    <link rel="stylesheet" href="../CSS/home.css" />
  </head>
  <body>
    <div class="layout-principal">
      <div class="contenido-principal">
        <h1>Control de Acceso Vehicular</h1>
        
        <div class="validador-container">
          <p style="color: #374151; font-weight: 600; margin-top: 0;">Pegue el código de acceso o use el escáner QR:</p>
          
          <textarea id="inputCodigo" class="input-codigo" placeholder="Ej: CfDJ8B..."></textarea>
          
          <button id="btnValidar" type="button" class="btn-cyber" style="width: 100%;">
            Validar Acceso
            <span class="btn-cyber-border"></span>
          </button>
          
          <div id="resultadoValidacion"></div>
          <div id="infoVehiculo" class="info-vehiculo"></div>
        </div>
      </div>

      <aside class="sidebar-derecho">
        <h2>OPCIONES</h2>
        <button type="button" class="btn-cyber btn-sidebar" id="btnCerrarSesion">
          Cerrar Sesión
          <span class="btn-cyber-border"></span>
        </button>
      </aside>
    </div>

    <script src="../JS/Check.js"></script>
  </body>
</html>
