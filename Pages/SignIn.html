<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="auth.css" />
</head>
<body>
    <div class="auth-container">
        <h1>Registrarse en la app</h1>
        <form id="Registro" autocomplete="off">
            <p>
                <label for="nombres">Nombres:</label>
                <!-- El pattern obliga a iniciar con letra, permite espacios en medio, y obliga a terminar con letra -->
                <input type="text" id="nombres" name="nombres" 
                       pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ]+(?: [a-zA-ZáéíóúÁÉÍÓÚñÑ]+)*$" 
                       title="Debe iniciar y terminar con una letra, usando solo un espacio entre nombres." 
                       required />
            </p>
            <p>
                <label for="APaterno">Apellido Paterno:</label>
                <input type="text" id="APaterno" name="APaterno" required />
            </p>
            <p>
                <label for="AMaterno">Apellido Materno:</label>
                <input type="text" id="AMaterno" name="AMaterno" required />
            </p>
            <p>
                <label for="CURP">CURP:</label>
                <input type="text" id="CURP" name="CURP" required />
            </p>
            <p>
                <label for="RFC">RFC:</label>
                <input type="text" id="RFC" name="RFC" placeholder="Opcional"/>
            </p>
            <p>
                <label for="email">Correo:</label>
                <input type="email" id="email" name="email" required />
            </p>
            <p>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required />
            </p>
            <p>
                <button type="submit">Registrarse</button>
            </p>
            <p id="mensaje"></p>
        </form>
    </div>
        
    <script>
        document.getElementById("Registro").addEventListener("submit", async function (e) {
            e.preventDefault(); 

            const mensaje = document.getElementById("mensaje");
            mensaje.textContent = "Registrando...";

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // --- MAGIA AQUÍ: Dividimos el campo "nombres" para que tu API no falle ---
            // 1. Separamos el texto usando el espacio como divisor
            const nombresArray = data.nombres.trim().split(" ");
            
            // 2. El primer elemento es el Primer Nombre
            data.primerNombre = nombresArray[0];
            
            // 3. Si hay más palabras, las unimos de nuevo para el Segundo Nombre, si no, lo mandamos vacío
            data.segundoNombre = nombresArray.length > 1 ? nombresArray.slice(1).join(" ") : null;
            
            // 4. Borramos la propiedad "nombres" original para que el JSON quede exactamente como tu DTO de C#
            delete data.nombres;

            try {
                const res = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data) 
                });

                if (!res.ok) {
                    const errText = await res.text();
                    mensaje.textContent = "Error al registrar: " + errText;
                    return;
                }

                mensaje.textContent = "¡Registro exitoso! Redirigiendo al login...";
                
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (err) {
                mensaje.textContent = "Error de red: " + err.message;
            }
        });
    </script>
</body>
</html>
