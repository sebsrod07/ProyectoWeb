<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign In</title>
        <link rel="stylesheet" href="auth.css" />
    </head>
    <body>
        <div class="auth-container">
            <h1>Registrarse en la app</h1>
        <form id="Registro" autocomplete="off">
            <p>
                <label for="primerNombre">Primer Nombre: </label>
                <input type="text" id="primerNombre" name="primerNombre" required/>
            </p>
            <p>
                <label for="segundoNombre">Segundo Nombre: </label>
                <input type="text" id="segundoNombre" name="segundoNombre"/>
            </p>
            <p>
                <label for="APaterno">Apellido Paterno: </label>
                <input type="text" id="APaterno" name="APaterno" required/>
            </p>
            <p>
                <label for="AMaterno">Apellido Materno: </label>
                <input type="text" id="AMaterno" name="AMaterno" required/>
            </p>
            <p>
                <label for="CURP">CURP: </label>
                <input type="text" id="CURP" name="CURP" required/>
            </p>
            <p>
                <label for="RFC">RFC: </label>
                <input type="text" id="RFC" name="RFC" />
            </p>
            <p>
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" required />
            </p>
            <p>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required />
            </p>
            <p>
                <button type="submit">Registrarse</button>
            </p>
            <p id="mensaje"></p>
        </div>
        
        <script>
            document.getElementById("Registro").addEventListener("submit", async function (e) {
                e.preventDefault(); // Evita que la página se recargue

                const mensaje = document.getElementById("mensaje");
                mensaje.textContent = "Registrando...";

                // Recolecta todos los valores de los inputs usando sus atributos 'name'
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                try {
                    // Cambia "/api/registro" por la ruta real de tu endpoint en C#
                    const res = await fetch("/api/register", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data) // Convierte el objeto JS a un string JSON
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        mensaje.textContent = "Error al registrar: " + errText;
                        return;
                    }

                    mensaje.textContent = "¡Registro exitoso! Redirigiendo al login...";
                    
                    // Redirige al usuario para que inicie sesión con su nueva cuenta
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);

                } catch (err) {
                    mensaje.textContent = "Error de red: " + err.message;
                }
            });
        </script>
        </form>
    </body>
</html>
