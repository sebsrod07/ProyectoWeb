<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
</head>
<body>
  <h1>Iniciar sesión</h1>

  <form id="loginForm" autocomplete="on">
    <p>
      <label for="email">Correo</label><br />
      <input type="email" id="email" name="email" required />
    </p>
    <p>
      <label for="password">Contraseña</label><br />
      <input type="password" id="password" name="password" required />
    </p>
    <p>
      <button type="submit">Entrar</button>
    </p>
  </form>

  <p id="mensaje" role="status"></p>

  <script>
    const TOKEN_KEY = "jwtToken";

    function authHeaders(extraHeaders) {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = { ...(extraHeaders || {}) };
      if (token) {
        headers.Authorization = "Bearer " + token;
      }
      return headers;
    }

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = "Enviando…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password }),
        });

        if (!res.ok) {
          const errText = await res.text();
          mensaje.textContent = errText || "No se pudo iniciar sesión.";
          return;
        }

        let token = (await res.text()).trim();
        if (token.startsWith('"') && token.endsWith('"')) {
          token = JSON.parse(token);
        }
        localStorage.setItem(TOKEN_KEY, token);
        mensaje.textContent = "Sesión iniciada. Token guardado para el header Authorization.";
      } catch (err) {
        mensaje.textContent = "Error de red: " + err.message;
      }
    });

    window.authHeaders = authHeaders;
  </script>
</body>
</html>
